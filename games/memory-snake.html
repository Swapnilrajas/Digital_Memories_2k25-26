<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Snake | XII.oncamera</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 20%, #302000 0%, #090909 35%, #030303 100%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .game-wrapper {
      width: min(95vw, 650px);
      text-align: center;
    }

    .logo {
      font-size: 14px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(35px, 8vw, 60px);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    .screen {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255, 190, 50, 0.25);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 0 50px rgba(255, 180, 0, 0.08);
    }

    .hidden {
      display: none !important;
    }

    input {
      width: 100%;
      max-width: 350px;
      padding: 15px 18px;
      border-radius: 12px;
      border: 1px solid #555;
      background: #111;
      color: white;
      outline: none;
      font-size: 16px;
      margin: 15px 0;
    }

    input:focus {
      border-color: #f5b82e;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 24px;
      background: #f5b82e;
      color: #111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      color: #ddd;
      font-size: 15px;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      margin: auto;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        #080808;
      background-size: 25px 25px;
      border: 1px solid rgba(255,190,50,.25);
      border-radius: 14px;
    }

    .mobile-controls {
      margin: 18px auto 0;
      width: 180px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .mobile-controls button {
      padding: 12px;
      font-size: 20px;
      background: #1b1b1b;
      color: white;
      border: 1px solid #333;
    }

    .up {
      grid-column: 2;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .result-score {
      font-size: 55px;
      font-weight: bold;
      color: #f5b82e;
      margin: 15px 0;
    }

    .status {
      min-height: 24px;
      margin: 12px 0;
      color: #aaa;
      font-size: 14px;
    }

    .success {
      color: #72e6a0;
    }

    .error {
      color: #ff7777;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    @media (min-width: 700px) {
      .mobile-controls {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="game-wrapper">

  <div class="logo">XII.ONCAMERA • MEMORY ARCADE</div>

  <h1>🐍 Memory Snake</h1>
  <p class="subtitle">Collect the memories. Beat your personal best.</p>

  <!-- START SCREEN -->
  <div id="startScreen" class="screen">

    <h2>Enter Your Name</h2>

    <p style="color:#888; margin-top:8px;">
      Your score will be recorded automatically.
    </p>

    <input
      id="playerName"
      type="text"
      maxlength="20"
      placeholder="Your name"
      autocomplete="off"
    >

    <br>

    <button id="startBtn">START GAME</button>

    <div id="startStatus" class="status"></div>

  </div>


  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen hidden">

    <div class="score-bar">
      <span>👤 <span id="displayName"></span></span>
      <span>🏆 Score: <b id="score">0</b></span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="mobile-controls">

      <button class="up" data-direction="up">⬆️</button>

      <button class="left" data-direction="left">⬅️</button>
      <button class="down" data-direction="down">⬇️</button>
      <button class="right" data-direction="right">➡️</button>

    </div>

  </div>


  <!-- GAME OVER SCREEN -->
  <div id="gameOverScreen" class="screen hidden">

    <h2>Game Over 🎮</h2>

    <p id="finalPlayer"></p>

    <div class="result-score" id="finalScore">0</div>

    <p id="bestMessage"></p>

    <div id="submitStatus" class="status">
      Saving your score...
    </div>

    <button id="playAgainBtn">PLAY AGAIN</button>

    <br>

    <a href="../arcade.html" class="back">
      ← Back to Memory Arcade
    </a>

  </div>

</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyDBcwuTlwLmW388k1cuWVIb-t0PseH78V4",

  authDomain: "xii-oncamera.firebaseapp.com",

databaseURL: "https://xii-oncamera-default-rtdb.firebaseio.com/",

  projectId: "xii-oncamera",

  storageBucket: "xii-oncamera.firebasestorage.app",

  messagingSenderId: "1010193797198",

  appId: "1:1010193797198:web:75cfacefb390f0a3d9f31f"

};


const app = initializeApp(firebaseConfig);
console.log("🔥 FIREBASE APP INITIALIZED");

const auth = getAuth(app);

const db = getDatabase(app);
console.log("🔥 DATABASE CONNECTED", db);

signInAnonymously(auth)
  .then(() => {
    console.log("Firebase connected ✅");
  })
  .catch((error) => {
    console.error("Firebase error:", error);
  });


  let currentUser = null;


  // Anonymous login
  try {

    const result = await signInAnonymously(auth);

    currentUser = result.user;

  } catch (error) {

    console.error("Firebase login error:", error);

  }


  // ==========================================================
  // GAME VARIABLES
  // ==========================================================

  const canvas = document.getElementById("gameCanvas");

  const ctx = canvas.getContext("2d");

  const grid = 20;

  const tileCount = canvas.width / grid;

  let snake;

  let food;

  let dx;

  let dy;

  let nextDx;

  let nextDy;

  let score = 0;

  let gameLoop;

  let gameSpeed = 180;

  let playerName = "";


  // ==========================================================
  // ELEMENTS
  // ==========================================================

  const startScreen =
    document.getElementById("startScreen");

  const gameScreen =
    document.getElementById("gameScreen");

  const gameOverScreen =
    document.getElementById("gameOverScreen");

  const playerNameInput =
    document.getElementById("playerName");

  const displayName =
    document.getElementById("displayName");

  const scoreElement =
    document.getElementById("score");

  const finalScore =
    document.getElementById("finalScore");

  const finalPlayer =
    document.getElementById("finalPlayer");

  const bestMessage =
    document.getElementById("bestMessage");

  const submitStatus =
    document.getElementById("submitStatus");

  const startStatus =
    document.getElementById("startStatus");


  // ==========================================================
  // START GAME
  // ==========================================================

  document
    .getElementById("startBtn")
    .addEventListener("click", startGame);


  playerNameInput
    .addEventListener("keydown", e => {

      if (e.key === "Enter") {
        startGame();
      }

    });


  function startGame() {

    playerName =
      playerNameInput.value.trim();

    if (!playerName) {

      startStatus.textContent =
        "Please enter your name.";

      startStatus.className =
        "status error";

      return;
    }


    if (!currentUser) {

      startStatus.textContent =
        "Connecting to leaderboard...";

      startStatus.className =
        "status error";

      return;
    }


    startStatus.textContent = "";


    displayName.textContent =
      playerName;


    score = 0;

    scoreElement.textContent =
      score;


    snake = [

      {
        x: 10,
        y: 10
      }

    ];


    dx = 1;
    dy = 0;

    nextDx = 1;
    nextDy = 0;

    gameSpeed = 130;


    createFood();
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    clearInterval(gameLoop);
    gameLoop =
      setInterval(updateGame, gameSpeed);
  }
  // ==========================================================
  // FOOD
  // ==========================================================
  function createFood() {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(
          Math.random() * tileCount
        ),
        y: Math.floor(
          Math.random() * tileCount
        )
      };
      valid = !snake.some(
        part =>
          part.x === food.x &&
          part.y === food.y
      );
    }
  }
  // ==========================================================
  // GAME UPDATE
  // ==========================================================
  function updateGame() {
    dx = nextDx;
    dy = nextDy;
    const head = {
      x: snake[0].x + dx,
      y: snake[0].y + dy
    };
    // Wall collision
    if (
      head.x < 0 ||
      head.x >= tileCount ||
      head.y < 0 ||
      head.y >= tileCount
    ) {
      gameOver();
      return;
    }
    // Body collision
    if (
      snake.some(
        part =>
          part.x === head.x &&
          part.y === head.y
      )
    ) {
      gameOver();
      return;
    }
    snake.unshift(head);
    // Food collision
    if (
      head.x === food.x &&
      head.y === food.y
    ) {
      score += 10;
      scoreElement.textContent =
        score;
      createFood();
      // Increase speed every 50 points
      if (score % 50 === 0) {
        gameSpeed =
          Math.max(
            55,
            gameSpeed - 10
          );
        clearInterval(gameLoop);
        gameLoop =
          setInterval(
            updateGame,
            gameSpeed
          );
      }
    } else {
      snake.pop();
    }
    drawGame();
  }
  // ==========================================================
  // DRAW GAME
  // =========================================================
  function drawGame() {
    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
    // Food
    ctx.font = "18px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(
      "⭐",
      food.x * grid + grid / 2,
      food.y * grid + grid / 2
    );
    // Snake
    snake.forEach((part, index) => {
      ctx.fillStyle =
        index === 0
          ? "#f5b82e"
          : "#d69216";
      ctx.beginPath();
      ctx.roundRect(
        part.x * grid + 2,
        part.y * grid + 2,
        grid - 4,
        grid - 4,
        5
      );
      ctx.fill();
      // Eyes
      if (index === 0) {
        ctx.fillStyle = "#111";
        ctx.fillRect(
          part.x * grid + 6,
          part.y * grid + 6,
          3,
          3
        );
        ctx.fillRect(
          part.x * grid + 13,
          part.y * grid + 6,
          3,
          3
        );
      }
    });
  }
  // ==========================================================
  // GAME OVER
  // ==========================================================
  async function gameOver() {
    clearInterval(gameLoop);
    finalPlayer.textContent =
      playerName;
    finalScore.textContent =
      score;
    gameScreen.classList.add("hidden");
    gameOverScreen.classList.remove("hidden");
    submitStatus.textContent =
      "Saving your score...";
    submitStatus.className =
      "status";
    try {
      const result =
        await submitBestScore(
          playerName,
          score
        );
      if (result.updated) {
        bestMessage.textContent =
          `🎉 New personal best: ${result.score}`;
        bestMessage.className =
          "success";
      } else {
        bestMessage.textContent =
          `Your personal best is ${result.bestScore}`;
        bestMessage.className =
          "";
      }
      submitStatus.textContent =
        "✓ Score saved automatically";
      submitStatus.className =
        "status success";
    } catch (error) {
      console.error(error);
      submitStatus.textContent =
        "Could not save score. Check Firebase settings.";
      submitStatus.className =
        "status error";
    }
  }
  // ==========================================================
  // ⭐ BEST SCORE SYSTEM
  // ==========================================================
  async function submitBestScore(
    nickname,
    newScore
  ) {
    if (!currentUser) {
      throw new Error(
        "Not authenticated"
      );
    }
    /*
      DATA STRUCTURE:
      leaderboard
        memory-snake
          PLAYER_UID
            nickname
            score
            updatedAt

      Each player has ONE record.

      Higher score replaces old score.
      Lower score is ignored.
    */
    const playerRef = ref(
      db,
      `leaderboard/memory-snake/${currentUser.uid}`
    );
    const snapshot =
      await get(playerRef);
    const oldData =
      snapshot.exists()
        ? snapshot.val()
        : null;
    const oldScore =
      oldData &&
      typeof oldData.score === "number"
        ? oldData.score
        : 0;
    // New personal best
    if (newScore > oldScore) {
      await set(
        playerRef,
        {
          nickname:
            nickname.substring(0, 20),
          score:
            newScore,
          updatedAt:
            serverTimestamp()
        }
      );
      return {
        updated: true,
        score: newScore
      };
    }
    // Existing score is already higher
    return {
      updated: false,
      bestScore: oldScore
    };
  }
  // ==========================================================
  // PLAY AGAIN
  // ==========================================================
  document
    .getElementById("playAgainBtn")
    .addEventListener(
      "click",
      () => {

        gameOverScreen.classList.add("hidden");

        startScreen.classList.remove("hidden");

      }
    );


  // ==========================================================
  // KEYBOARD CONTROLS
  // ==========================================================

  document.addEventListener(
    "keydown",
    e => {

      const key =
        e.key.toLowerCase();
      if (
        (key === "arrowup" || key === "w") &&
        dy !== 1
      ) {
        nextDx = 0;
        nextDy = -1;
      }
      else if (
        (key === "arrowdown" || key === "s") &&
        dy !== -1
      ) {
        nextDx = 0;
        nextDy = 1;
      }
      else if (
        (key === "arrowleft" || key === "a") &&
        dx !== 1
      ) {
        nextDx = -1;
        nextDy = 0;
      }
      else if (
        (key === "arrowright" || key === "d") &&
        dx !== -1
      ) {
        nextDx = 1;
        nextDy = 0;
      }
    }
  );
  // ==========================================================
  // MOBILE CONTROLS
  // ==========================================================

  document
    .querySelectorAll(
      ".mobile-controls button"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const direction =
            button.dataset.direction;


          if (
            direction === "up" &&
            dy !== 1
          ) {

            nextDx = 0;
            nextDy = -1;

          }


          if (
            direction === "down" &&
            dy !== -1
          ) {

            nextDx = 0;
            nextDy = 1;

          }


          if (
            direction === "left" &&
            dx !== 1
          ) {

            nextDx = -1;
            nextDy = 0;

          }


          if (
            direction === "right" &&
            dx !== -1
          ) {

            nextDx = 1;
            nextDy = 0;

          }

        }
      );

    });


  // Initial screen

  startScreen.classList.remove("hidden");

</script>

</body>
</html>
